name: sync-marketplace

# Drift must be repaired through a reviewed PR, so this job has no write token.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/sync-marketplace.mjs'
      - '.claude-plugin/marketplace.json'
      - '.github/plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.codex-plugin/plugin.json'
      - 'plugin.json'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-marketplace
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Manifest repairs need the same reviewed PR path as their source edits.
      - name: Verify manifests
        run: node scripts/sync-marketplace.mjs --check
