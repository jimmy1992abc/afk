name: require-owner-approval

# Contributor authorization is separate from independent-model review. An admin
# author satisfies authorization, but does not prove that any review happened.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  gate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check contributor authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          perm_of() { gh api "repos/$REPO/collaborators/$1/permission" --jq '.permission' 2>/dev/null || echo none; }
          author=$(gh api "repos/$REPO/pulls/$PR" --jq '.user.login')
          author_perm=$(perm_of "$author")
          echo "PR author: $author ($author_perm)"
          if [ "$author_perm" = "admin" ]; then
            echo "Admin author satisfies contributor authorization; owner and independent-model reviews remain required by policy."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')
          if ! reviews=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp); then
            echo "::error::Could not fetch complete review history."
            exit 1
          fi
          if ! approvers=$(jq -r --arg head "$head" '
            if type == "array" and all(.[]; type == "array") then .
            else error("invalid review pages") end
            | reduce .[][] as $review ({};
                if ($review.user.login | type != "string" or length == 0)
                  or ($review.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED", "COMMENTED", "PENDING") | not)
                then error("invalid review record")
                elif ($review.state | IN("APPROVED", "CHANGES_REQUESTED", "DISMISSED"))
                then .[$review.user.login] = $review
                else . end)
            | .[] | select(.state == "APPROVED" and .commit_id == $head) | .user.login
          ' <<< "$reviews"); then
            echo "::error::Could not evaluate complete review history."
            exit 1
          fi
          for u in $approvers; do
            if [ "$(perm_of "$u")" = "admin" ]; then
              echo "Approved on the current head commit by an admin ($u)."
              exit 0
            fi
          done
          echo "::error::This PR needs an approving review on the latest commit from a repository admin before it can merge."
          exit 1
